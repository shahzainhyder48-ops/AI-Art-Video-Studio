<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Art Video Studio</title><link rel="stylesheet" href="style.css"></head><body><main><header><span class="badge">OPEN SOURCE • STARTER</span><h1>AI Art Video Studio</h1><p>Create your story. Plan every scene. Prepare for video rendering.</p></header><section class="panel"><form id="studio"><label>Video topic<input id="topic" placeholder="A lonely lantern in the rain" required></label><label>Or paste your own script<textarea id="script" rows="5" placeholder="One scene per line..."></textarea></label><div class="grid"><label>Duration (seconds)<input id="duration" type="number" min="5" max="600" value="80" required></label><label>Art style<select id="style"><option>Cinematic watercolor</option><option>Anime</option><option>Storybook illustration</option><option>3D cartoon</option></select></label><label>Voice<select id="voice"><option value="yes">With voice</option><option value="no">Without voice</option></select></label><label>Loop<select id="loop"><option value="no">Off</option><option value="yes">On</option></select></label></div><button type="submit">Create scene plan</button></form></section><section id="result" class="panel" hidden><h2>Your video plan</h2><p id="summary"></p><ol id="scenes"></ol><button id="download" type="button">Download scene plan (.json)</button></section><footer>This is a working browser-based scene planner. Actual AI images, speech, video generation and MP4 export require a connected rendering backend.</footer></main><script src="app.js"></script></body></html>
